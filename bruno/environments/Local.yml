name: Local
variables:
  - name: apiUrl
    value: http://localhost:9095
    enabled: true
    secret: false
    description: آدرس سرویس ارسال وقتی api روی خود ماشین اجرا شده باشد.

  - name: reportUrl
    value: http://localhost:9096
    enabled: true
    secret: false
    description: آدرس سرویس گزارش. از api جداست و می‌تواند خاموش باشد.

  - name: tenantId
    value: 11111111-1111-1111-1111-111111111111
    enabled: true
    secret: false
    description: همان کاربر اسکریپت ./mock در ریشهٔ پروژه (wallet + گزارش ClickHouse).

  - name: redisPort
    value: "6379"
    enabled: true
    secret: false
    description: پورت Redis برای ساخت کیف پول قبل از ارسال.
