docs: |-
  # گزارش پیامک

  این پوشه به سرویس `report` می‌رود، نه به `api`. اگر آن کانتینر یا پروسه خاموش باشد، برونو به `9096` وصل نمی‌شود و ارسال پیام همچنان کار می‌کند.

  هر درخواست باید `tenant_id` داشته باشد. بدون آن گزارش بقیهٔ مشتری‌ها برنمی‌گردد.

  بازهٔ پیش‌فرض هفت روز اخیر است. بازهٔ بیشتر از ۹۳ روز با `400` رد می‌شود. تاریخ `YYYY-MM-DD` نیمه‌شب UTC است. `RFC3339` هم قبول است. `to` خودِ آن لحظه را شامل نمی‌شود.

  | کد | معنی |
  | --- | --- |
  | 200 | گزارش خوانده شد. فهرست می‌تواند خالی باشد |
  | 400 | فیلتر نامعتبر است. متن `error` همان دلیل است |
  | 500 | ClickHouse در دسترس نیست یا کوئری شکست خورده |
