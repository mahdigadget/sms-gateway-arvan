info:
  name: جمع وضعیت
  type: http
  seq: 2

http:
  method: GET
  url: "{{reportUrl}}/api/v1/sms/report/summary?tenant_id={{tenantId}}"
  params:
    - name: tenant_id
      value: "{{tenantId}}"
      type: query
      description: UUID مشتری. اجباری است.
    - name: from
      value: "2026-10-01"
      type: query
      disabled: true
      description: ابتدای بازه. تاریخ روز نیمه‌شب UTC است.
    - name: to
      value: "2026-10-07"
      type: query
      disabled: true
      description: پایان بازه، غیرشامل.
    - name: kind
      value: normal
      type: query
      disabled: true
      description: otp یا normal. اگر روشن باشد جمع فقط همان نوع است.
    - name: status
      value: accepted
      type: query
      disabled: true
      description: اگر روشن باشد، شمارنده‌های وضعیت‌های دیگر صفر می‌مانند.
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.tenant_id
      operator: eq
      value: "{{tenantId}}"
    - expression: res.body.total
      operator: isNumber
    - expression: res.body.net_cost
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /api/v1/sms/report/summary

  تعداد و هزینهٔ همان بازه و همان فیلتر را یکجا برمی‌گرداند. صفحه‌بندی ندارد.

  ## پاسخ 200

  ```json
  {
    "tenant_id": "11111111-1111-1111-1111-111111111111",
    "from": "2026-09-30T12:00:00Z",
    "to": "2026-10-07T12:00:00Z",
    "total": 0,
    "accepted": 0,
    "rejected": 0,
    "refunded": 0,
    "accepted_cost": 0,
    "refunded_cost": 0,
    "net_cost": 0
  }
  ```

  `net_cost` برابر `accepted_cost` منهای `refunded_cost` است. پیام rejected در هزینه نیست، چون کسر نشده است.

  بعد از `./mock` برای همین `tenantId`: `total=5`، `accepted=3`، `refunded=1`، `rejected=1`، `accepted_cost=3`، `refunded_cost=1`، `net_cost=2`.
