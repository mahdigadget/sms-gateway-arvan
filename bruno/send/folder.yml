docs: |-
  # ارسال پیامک

  هر دو مسیر روی سرویس `api` هستند.

  ترتیب کار: اعتبارسنجی بدنه، رزرو یک واحد در Redis، سپس produce در Kafka و انتظار برای ack. اگر Kafka قبول نکند، رزرو برمی‌گردد و پاسخ `500` است.

  هزینهٔ هر پیام ۱ است.

  | کد | معنی |
  | --- | --- |
  | 202 | در صف قرار گرفت |
  | 400 | بدنه ناقص یا `deadline_at` نامعتبر |
  | 402 | موجودی کیف پول کافی نیست |
  | 409 | همان درخواست هنوز processing است، یا کلید idempotency جواب قابل‌خواندن ندارد |
  | 500 | رزرو یا صف Kafka شکست خورد |
  | 503 | کلید `wallet:{tenant_id}` در Redis نیست |
