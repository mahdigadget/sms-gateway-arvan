  redis-data:
  kafka-data:
  clickhouse-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

x-app: &app
  image: sms-gateway-arvan:local
  build:
    context: .
    dockerfile: Dockerfile
  networks: [sms]
  restart: unless-stopped

